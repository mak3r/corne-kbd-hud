[build-system]
requires = ["briefcase"]

[tool.briefcase]
project_name = "Corne HUD"
bundle = "com.mak3r"
version = "0.1.0"
url = "https://github.com/mak3r/corne-kbd-hud"
author = "Mark Abrams"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[tool.briefcase.app.corne_kbd_hud]
formal_name = "Corne HUD"
description = "Real-time keymap layer viewer for the Halcyon Corne"
long_description = "A real-time keymap layer viewer for the Halcyon Corne, reading layer state over USB HID."
sources = ["src/corne_kbd_hud"]
requires = [
    "PySide6>=6.11",
    "hid>=1.0",
]

[tool.briefcase.app.corne_kbd_hud.macOS]
# PySide6's macOS wheel (6.11.2+) is built with a macosx_13_0 platform tag --
# Briefcase's default min_os_version of 11.0 makes pip reject it as
# incompatible ("no matching distribution"), even though Requires-Python
# itself is satisfied. 13.0 is the actual floor PySide6 supports here.
min_os_version = "13.0"
# universal2 builds pip-install requirements twice (once per arch) and lipo-merge
# the results. On this machine the x86_64-side install silently installs nothing
# (no x86_64 Python 3.14 toolchain available), and Briefcase's merge step then
# silently drops several .so files instead of falling back to a copy -- notably
# shiboken6/Shiboken.abi3.so, breaking PySide6 entirely at import time. Building
# arm64-only skips the merge step and avoids this. Fine for personal use on
# Apple Silicon; revisit if this ever needs to run on an Intel Mac. See #1.
universal_build = false
requires = [
    "PySide6>=6.11",
    "hid>=1.0",
    "pyobjc-framework-Cocoa>=10.0",
]
# For a packaged build, this is the more standard equivalent of the
# runtime NSApplicationActivationPolicyAccessory call in app.py -- hides
# the Dock icon at the bundle level. Belt and suspenders; untested, since
# packaging itself hasn't been attempted yet (see README's Status section).
info.LSUIElement = true

[tool.briefcase.app.corne_kbd_hud.windows]
requires = [
    "PySide6>=6.11",
    "hid>=1.0",
]

[tool.briefcase.app.corne_kbd_hud.linux]
requires = [
    "PySide6>=6.11",
    "hid>=1.0",
]
